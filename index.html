<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->

      async
      src="https://www.googletagmanager.com/gtag/js?id=G-9MLXG6SFE1"
    ></script>
    <script>

      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-9MLXG6SFE1");

    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mentorship Program — DAF CGOC</title>
    <meta
      name="description"
      content="The DAF CGOC Mentorship Program pairs soon-to-commission cadets and new Lieutenants with experienced Company Grade Officers at their first duty station. Guidance, not oversight."
    />
    <meta
      name="author"
      content="Department of the Air Force Company Grade Officers' Council"
    />
    <meta name="theme-color" content="#0E1116" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- MVP: keep out of search until approved for prod -->

    <link rel="canonical" href="https://dafcgoc.org/penpal.html" />

    <meta
      content="DAF CGOC Mentorship Program — Cadet to Lieutenant"
      property="og:title"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Pairing cadets and new Lieutenants with experienced Company Grade Officers. Guidance, not oversight."
    />
    <meta
      property="og:image"
      content="https://dafcgoc.org/assets/images/og-dafcgoc.png"
    />
    <meta property="og:url" content="https://dafcgoc.org/penpal.html" />

    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/penpal.css" />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.15.1/css/all.css"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.15.1/css/v4-shims.css"
    />

    <link rel="shortcut icon" href="favicon.png" />
  </head>

  <body>
    <div class="scroll-progress" aria-hidden="true"></div>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- ============ Minimal header (no site nav) ============ -->
    <header class="site-head">
      <div class="container site-head__inner">
        <a
          class="site-head__brand"
          href="https://dafcgoc.org"
          aria-label="DAF CGOC — back to main site"
        >
          <img
            src="assets/logos/dafcgoc-logo.png"
            alt="DAF CGOC"
            width="112"
            height="42"
          />
          <span class="site-head__brandtext">Mentorship&nbsp;Program</span>
        </a>
        <a class="btn btn--gold btn--sm magnetic" href="#intake">Sign up</a>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <!-- ============ Hero (audience toggle) ============ -->
      <section class="hero">
        <div class="hero__aura" aria-hidden="true"></div>
        <div class="hero__grain" aria-hidden="true"></div>
        <div class="container hero__inner">
          <fieldset class="segmented" id="audience">
            <legend class="segmented__legend">I'm here as a</legend>
            <div class="segmented__track">
              <label class="segmented__seg">
                <input
                  class="sr-only"
                  type="radio"
                  name="audience"
                  value="cadet"
                  checked
                />
                <i class="fas fa-graduation-cap" aria-hidden="true"></i
                ><span>Cadet / new Lt</span>
              </label>
              <label class="segmented__seg">
                <input
                  class="sr-only"
                  type="radio"
                  name="audience"
                  value="mentor"
                />
                <i class="fas fa-user-astronaut" aria-hidden="true"></i
                ><span>Mentor (CGO)</span>
              </label>
            </div>
          </fieldset>

          <div class="hero-swap" aria-live="polite">
            <div class="hero-swap__panel is-active" data-audience="cadet">
              <p class="eyebrow">DAF CGOC · Mentorship Program</p>
              <h1 class="display">
                Coming Soon
              </h1>
            </div>
    <script src="js/penpal.js" defer></script>
  </body>
</html>
